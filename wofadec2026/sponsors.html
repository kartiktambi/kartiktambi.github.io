<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c3007">
<title>Sponsors | ICAI WOFA 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --brand:#6c3007;
  --brand-mid:#a1480c;
  --brand-soft:#fdf4ec;
  --brand-line:#fad9c1;
  --ink:#2a211b;
  --muted:#6f6256;
  --line:#f0e6dc;
}

body{
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  background:#faf7f4;
  color:var(--ink);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

.wrap{width:min(100% - 32px,900px);margin:0 auto;padding:26px 0 44px}

/* ---------- tier label ---------- */
.tier{display:flex;align-items:center;gap:11px;margin:0 0 14px}
.tier:before{content:"";flex:0 0 5px;height:21px;border-radius:5px;background:linear-gradient(180deg,var(--brand-mid),var(--brand))}
.tier span{color:var(--brand);font-size:.82rem;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}

.group{margin-top:34px}
.group:first-child{margin-top:0}

/* ---------- card ---------- */
.card{
  position:relative;
  display:block;
  overflow:hidden;
  padding:22px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:0 10px 30px rgba(74,40,12,.07);
  color:inherit;
  text-decoration:none;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}

.card:before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,var(--brand-mid),var(--brand));
}

.card:after{
  content:"";
  position:absolute;
  z-index:0;
  width:170px;height:170px;
  top:-96px;right:-62px;
  border-radius:50%;
  background:var(--brand);
  opacity:.05;
  pointer-events:none;
}

.card:hover{transform:translateY(-4px);border-color:var(--brand-line);box-shadow:0 18px 38px rgba(74,40,12,.13)}

/* ---------- logo tiles ---------- */
.logo-tile{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  width:100%;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  overflow:hidden;
}
.logo-tile img{display:block;width:100%;height:100%;object-fit:contain}

.text-tile{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;
  border-radius:15px;
  background:linear-gradient(135deg,var(--brand-mid),var(--brand));
  overflow:hidden;
}
.text-tile .mark{color:#fff;font-weight:800;letter-spacing:4px;line-height:1}
.text-tile .sub{margin-top:5px;color:rgba(255,255,255,.82);font-weight:600;letter-spacing:1.4px}

/* ---------- meta ---------- */
.meta{position:relative;z-index:1;margin-top:17px}
.meta h2{font-size:1.18rem;line-height:1.35;font-weight:800;letter-spacing:-.2px}
.pill{
  display:inline-block;margin-top:9px;
  padding:4px 11px;
  border:1px solid var(--brand-line);
  border-radius:999px;
  background:var(--brand-soft);
  color:var(--brand);
  font-size:.72rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
}
.visit{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:15px;
  color:var(--brand);
  font-size:.86rem;font-weight:800;
}
.visit svg{width:15px;height:15px;flex:0 0 15px}

/* ---------- title sponsor (largest) ---------- */
.card-title .logo-tile{height:132px;padding:16px}
.card-title .meta h2{font-size:1.5rem}

/* ---------- lead + titanium row ---------- */
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row .logo-tile,.row .text-tile{height:104px;padding:14px}
.row .text-tile{padding:0}
.row .text-tile .mark{font-size:1.4rem}
.row .text-tile .sub{font-size:.68rem}

@media(max-width:700px){
  .row{grid-template-columns:1fr;gap:18px}
  .row .logo-tile,.row .text-tile{height:112px}
}

@media(max-width:480px){
  .wrap{width:calc(100% - 24px);padding:20px 0 34px}
  .card{padding:18px;border-radius:19px}
  .card-title .logo-tile{height:112px;padding:13px}
  .card-title .meta h2{font-size:1.28rem}
  .meta h2{font-size:1.08rem}
  .group{margin-top:28px}
  .row .logo-tile,.row .text-tile{height:100px}
  .row .text-tile .mark{font-size:1.25rem;letter-spacing:3.5px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{transition:none!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<main class="wrap">

  <section class="group">
    <div class="tier"><span>Title Sponsor</span></div>
    <a class="card card-title" href="https://bnw.ae/en" target="_blank" rel="noopener noreferrer">
      <div class="logo-tile">
        <img src="https://wofa.icai.org/images/sponsors/bnw-logo.jpg" alt="BNW Developments logo">
      </div>
      <div class="meta">
        <h2>BNW Real Estate Development LLC</h2>
        <span class="pill">Corporate Sponsor</span>
        <div class="visit">Visit website
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </div>
      </div>
    </a>
  </section>

  <section class="group">
    <div class="row">

      <div>
        <div class="tier"><span>Lead Sponsor</span></div>
        <a class="card" href="https://www.adani.com/" target="_blank" rel="noopener noreferrer">
          <div class="logo-tile">
            <img src="https://wofa.icai.org/images/sponsors/adani-logo.jpg" alt="Adani Enterprises logo">
          </div>
          <div class="meta">
            <h2>Adani Enterprises Limited</h2>
            <span class="pill">Corporate Sponsor</span>
            <div class="visit">Visit website
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
            </div>
          </div>
        </a>
      </div>

      <div>
        <div class="tier"><span>Titanium Sponsor</span></div>
        <a class="card" href="https://sarc.global/" target="_blank" rel="noopener noreferrer">
          <div class="text-tile">
            <div class="mark">SARC</div>
            <div class="sub">&amp; ASSOCIATES</div>
          </div>
          <div class="meta">
            <h2>SARC &amp; Associates</h2>
            <span class="pill">CA Firm</span>
            <div class="visit">Visit website
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
            </div>
          </div>
        </a>
      </div>

    </div>
  </section>

</main>

</body>
</html>
